# Kernel config fragment for docker / composectl container runtime.

# Namespaces
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

# cgroups (unified v2)
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CPUSETS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_PIDS=y
CONFIG_CFS_BANDWIDTH=y

# Overlay filesystem for container layer storage
CONFIG_OVERLAY_FS=y

# Bridging + veth for container networking.
CONFIG_BRIDGE=y
CONFIG_VETH=y

# Netfilter framework. Docker 29.x prefers the nftables backend but
# falls back to iptables-legacy when nft can't talk to the kernel;
# enable both so the runtime always has a working path.
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NETFILTER_XTABLES_LEGACY=y

# nftables backend (preferred by current docker).
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NF_TABLES_INET=y

# NAT (used by docker for outbound masquerade and port publishing).
CONFIG_NF_NAT=y
CONFIG_NF_NAT_MASQUERADE=y
CONFIG_NETFILTER_XT_NAT=m
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m

# Legacy iptables ip_tables/ip6_tables fallback path.
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_NAT=y

# POSIX message queues (used by some container init shims)
CONFIG_POSIX_MQUEUE=y
