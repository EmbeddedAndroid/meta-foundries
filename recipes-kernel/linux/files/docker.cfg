# Kernel config fragment for docker / composectl container runtime.

# Namespaces
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

# cgroups (unified v2)
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CPUSETS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_PIDS=y
CONFIG_CFS_BANDWIDTH=y

# Overlay filesystem for container layer storage
CONFIG_OVERLAY_FS=y

# Bridging + veth + base netfilter for container networking
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_NETFILTER=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NF_NAT=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y

# POSIX message queues (used by some container init shims)
CONFIG_POSIX_MQUEUE=y
