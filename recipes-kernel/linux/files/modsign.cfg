# Kernel config fragment for kernel module signing.
#
# Opt-in: requires the device to have signing infrastructure
# (signing key pair generated at kernel build time or supplied by
# the BSP). Enable per-factory via FIO_KERNEL_FEATURES.

CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y
