# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Composable brick: declares the meta-foundries + meta-updater layer
# pair. Designed to be header.includes'd by ci-jobs/*.yml or by a
# downstream meta-foundries-overlay/kas/factory.yml. The parent kas
# file provides the actual URLs / branches for these repos.

header:
  version: 14

repos:
  meta-foundries:
  meta-updater:

local_conf_header:
  # 32 GB hosts (CIL / partner-AWS Foundries CI workers) OOM with the
  # bitbake defaults (BB_NUMBER_THREADS=nproc, PARALLEL_MAKE=-j nproc).
  # Cap to half the core count to keep peak memory under the envelope.
  bb-parallel: |
    BB_NUMBER_THREADS = "16"
    PARALLEL_MAKE = "-j 16"
