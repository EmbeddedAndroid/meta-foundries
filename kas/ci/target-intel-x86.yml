# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Composable brick: meta-foundries on generic Intel x86_64. Stock
# oe-core / poky distro + meta-intel BSP. Proves the product layer
# works against a non-qcom BSP and provides the foundation for Intel
# factory builds.

header:
  version: 14
  includes:
    - kas/ci/base.yml

distro: poky

defaults:
  repos:
    branch: master

repos:
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    layers:
      .: excluded

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    layers:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization

  meta-intel:
    url: https://git.yoctoproject.org/meta-intel

machine: intel-corei7-64

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INIT_MANAGER = "systemd"
    PACKAGE_CLASSES = "package_ipk"
    INHERIT += "rm_work"
  sota: |
    DISTRO_FEATURES:append = " sota"
    INHERIT += "sota"
    SOTA_CLIENT = "aktualizr-lite"
  network: |
    # fioconfig RDEPENDS on networkmanager-nmcli; meta-updater's
    # sota_intel.bbclass force-appends "network-configuration" to
    # IMAGE_INSTALL with the :sota override AND pins
    # PREFERRED_RPROVIDER_network-configuration = "connman".
    # Override both so opkg installs NetworkManager and never sees
    # connman in the install set.
    DISTRO_FEATURES:append = " networkmanager"
    PREFERRED_RPROVIDER_network-configuration = "networkmanager"
    IMAGE_INSTALL:remove:sota = " network-configuration"
    IMAGE_INSTALL:append = " networkmanager"
    PACKAGE_EXCLUDE += "connman connman-client connman-tools connman-tests"
  bbmask: |
    # meta-foundries-overlay ships lmp-factory-image.bb (qcom) and
    # lmp-factory-image-intel.bb. The qcom one require's
    # qcom-multimedia-image.bb which only exists in meta-qcom-distro,
    # so it ParseError's on Intel builds where qcom-distro is absent.
    # Mask it so bitbake skips parsing it for x86_64 / Intel targets.
    # kas-container mounts the overlay layer at /build/../repo/ — the
    # repo-name segment isn't in the path bitbake sees, so anchor on
    # the recipe path within the layer. re.search semantics, "$"
    # prevents matching the lmp-factory-image-intel.bb sibling.
    BBMASK += "recipes-samples/images/lmp-factory-image\.bb$"
