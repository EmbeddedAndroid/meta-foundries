# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Composable brick: meta-foundries on qemuarm64. Used by CI as a
# portability smoke test (no vendor BSP); proves the layer parses
# and the product packages assemble against stock oe-core.

header:
  version: 14
  includes:
    - kas/ci/base.yml

distro: poky

defaults:
  repos:
    branch: master

repos:
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    layers:
      .: excluded

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    layers:
      meta-poky:

machine: qemuarm64

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INIT_MANAGER = "systemd"
    PACKAGE_CLASSES = "package_ipk"
    INHERIT += "rm_work"
