# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Composable brick: meta-foundries + meta-updater on top of the
# Thundercomm RUBIK Pi 3 machine + qcom-distro-sota distro
# composition.
#
# RUBIK Pi 3 (QCS6490) BSP lives in meta-qcom-3rdparty (added by
# qualcomm-linux/meta-qcom-3rdparty PR #41); the chain is:
#   meta-qcom-3rdparty/ci/qcs6490-thundercomm-rubikpi3.yml
#                                  ->  meta-qcom-3rdparty/ci/base.yml
#                                  ->  meta-qcom/ci/base.yml
# qcom-distro-sota.yml then layers the SOTA-enabled distro on top.
#
# Use from ci-jobs/rubikpi3.yml (smoke build) or from
# meta-foundries-overlay/kas/factory-rubikpi3.yml (factory image).

header:
  version: 14
  includes:
    - repo: meta-qcom-3rdparty
      file: ci/qcs6490-thundercomm-rubikpi3.yml
    - repo: meta-qcom
      file: ci/qcom-distro-sota.yml
    - kas/ci/base.yml

repos:
  meta-qcom:
  meta-qcom-distro:
  meta-qcom-3rdparty:

local_conf_header:
  # meta-qcom's ci/base.yml adds git.codelinaro.org as a MIRRORS
  # rewrite for all github URLs, but that mirror requires auth we
  # do not have. Override empty so MIRRORS stays at oe-core defaults.
  clo-mirrors: ""
